name: Publish NPM package 🚀
on:
  release:
    types: [created]
permissions:
  id-token: write  # Required for OIDC
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest  # Ensure npm 11.5.1 or later for trusted publishing
      - name: Publish package on NPM 📦
        run: npm publish
